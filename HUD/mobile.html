<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<title>J.A.R.V.I.S.</title>
<style>
  :root { --c: #00E5FF; --c-rgb: 0,229,255; --bg: #030811; }
  body.busy { --c: #FFB800; --c-rgb: 255,184,0; }
  body.alert { --c: #FF2A2A; --c-rgb: 255,42,42; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #CFF8FF; font-family: -apple-system, "SF Mono", Menlo, monospace; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 12px);
    background-image: linear-gradient(rgba(var(--c-rgb),.05) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--c-rgb),.05) 1px, transparent 1px);
    background-size: 24px 24px; transition: background-color .4s; }
  header { text-align: center; padding: 18px 0 8px; }
  .logo { color: var(--c); letter-spacing: .4em; font-weight: 300; font-size: 22px; text-shadow: 0 0 12px rgba(var(--c-rgb),.7); }
  .sub { font-size: 9px; letter-spacing: .25em; color: rgba(var(--c-rgb),.5); margin-top: 4px; }
  .core { width: 120px; height: 120px; margin: 18px auto; border-radius: 50%; position: relative;
    background: radial-gradient(circle, #fff 0, var(--c) 18%, rgba(var(--c-rgb),.25) 45%, transparent 70%);
    animation: breathe 2.4s ease-in-out infinite; }
  .core::before, .core::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 2px dashed rgba(var(--c-rgb),.6); animation: spin 12s linear infinite; }
  .core::after { inset: -28px; border: 1px solid rgba(var(--c-rgb),.25); border-top-color: var(--c); animation-duration: 5s; animation-direction: reverse; }
  body.busy .core::before, body.busy .core::after { animation-duration: 1.5s; }
  #log { flex: 1; overflow-y: auto; font-size: 15px; line-height: 1.45; padding: 4px 2px; }
  .me { color: rgba(var(--c-rgb),.6); margin: 10px 0 2px; font-size: 13px; }
  .me::before { content: "TU // "; }
  .j { margin-bottom: 8px; }
  .j::before { content: "JARVIS // "; color: var(--c); font-size: 11px; letter-spacing: .15em; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }
  .chip { flex: none; border: 1px solid rgba(var(--c-rgb),.4); color: var(--c); background: rgba(var(--c-rgb),.06); padding: 8px 12px; font-size: 12px; border-radius: 4px; }
  .confirm { display: none; gap: 10px; padding: 8px 0; }
  body.alert .confirm { display: flex; }
  .confirm button { flex: 1; padding: 14px; font-size: 15px; border: 1px solid #FF2A2A; color: #fff; background: rgba(255,42,42,.35); border-radius: 4px; }
  .confirm button.no { background: transparent; color: #FFB3B3; }
  form { display: flex; gap: 8px; border: 1px solid rgba(var(--c-rgb),.45); background: rgba(var(--c-rgb),.06); padding: 6px; border-radius: 6px; }
  input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 17px; padding: 8px; }
  form button { background: var(--c); color: var(--bg); border: none; font-weight: 600; padding: 0 16px; border-radius: 4px; font-size: 15px; }
  .hint { text-align: center; font-size: 10px; color: rgba(var(--c-rgb),.45); margin-top: 8px; letter-spacing: .1em; }
  .up { color: #2BFF88; } .down { color: #FF4D4D; }
  .core { width: 90px; height: 90px; }
  @keyframes breathe { 50% { transform: scale(1.06); } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header><div class="logo">J.A.R.V.I.S.</div><div class="sub">CONNESSO AL MAC // RETE LOCALE</div></header>
<div class="core"></div>
<div id="log"></div>
<div class="chips">
  <button class="chip">Briefing</button><button class="chip">Impegni di oggi</button><button class="chip">Mail non lette</button>
  <button class="chip">WhatsApp non letti</button><button class="chip">Notizie finanza</button><button class="chip">Notizie Italia</button>
</div>
<div class="confirm"><button id="yes">CONFERMA</button><button id="no" class="no">ANNULLA</button></div>
<form id="f"><input id="t" placeholder="Comando (usa il microfono della tastiera)" autocomplete="off"><button>INVIA</button></form>
<div class="hint">TOCCA IL MICROFONO DELLA TASTIERA PER DETTARE</div>
<script>
const TOKEN = "__TOKEN__";
const log = document.getElementById("log");
function add(cls, text) { const d = document.createElement("div"); d.className = cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; }
function say(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\[[a-z]{1,2}\d+\]/g, ""));
  u.lang = "it-IT"; u.rate = 1.05;
  speechSynthesis.speak(u);
}
async function ask(text) {
  add("me", text);
  document.body.className = "busy";
  try {
    const r = await fetch("/ask", { method: "POST", headers: { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    const reply = await r.text();
    add("j", reply);
    document.body.className = /conferma|confermi|procedo\?/i.test(reply) ? "alert" : "";
    say(reply);
  } catch (e) {
    document.body.className = "";
    add("j", "Mac non raggiungibile: deve essere acceso, sveglio e sulla stessa rete (o su Tailscale).");
  }
}
document.getElementById("f").onsubmit = (e) => { e.preventDefault(); const t = document.getElementById("t"); const v = t.value.trim(); if (v) { t.value = ""; ask(v); } };
document.querySelectorAll(".chip").forEach((b) => b.onclick = () => ask(b.textContent));
document.getElementById("yes").onclick = () => ask("sì");
document.getElementById("no").onclick = () => ask("no");
add("j", "Collegato, signore. Come posso aiutarla?");

</script>
</body>
</html>
